<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title description">
  <title id="title">Gatecrash terminal access map</title>
  <description id="description">A minimal snapshot of Gatecrash comparing three routes across an owner, a member, and an anonymous session.</description>

  <rect width="1200" height="400" fill="#0B0D0C"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace">
    <text x="64" y="56" fill="#F4F1E9" font-size="28" font-weight="700" letter-spacing="-1">gatecrash</text>
    <text x="1136" y="54" fill="#5C636D" font-size="14" text-anchor="end">same request · wrong session</text>
    <path d="M64 80H1136" stroke="#20252A" stroke-width="2"/>

    <text x="64" y="124" fill="#9CA2AB" font-size="15" font-weight="700">access map</text>
    <text x="1136" y="124" fill="#5C636D" font-size="14" text-anchor="end">3 routes · 3 sessions</text>

    <g fill="#5C636D" font-size="13">
      <text x="92" y="163">request</text>
      <text x="606" y="163">alice/base</text>
      <text x="794" y="163">bob</text>
      <text x="946" y="163">anonymous</text>
    </g>

    <g font-size="16">
      <rect x="64" y="183" width="4" height="20" fill="#FF665E"/>
      <text x="92" y="200" fill="#F4F1E9">GET /api/account/alice</text>
      <text x="606" y="200" fill="#83A92F">200 ●</text>
      <text x="794" y="200" fill="#FF665E">200 !</text>
      <text x="946" y="200" fill="#6EE7A8">401 ✓</text>

      <rect x="64" y="227" width="4" height="20" fill="#FF665E"/>
      <text x="92" y="244" fill="#F4F1E9">GET /api/member/export</text>
      <text x="606" y="244" fill="#83A92F">200 ●</text>
      <text x="794" y="244" fill="#78A8FF">200 ≠</text>
      <text x="946" y="244" fill="#FF665E">200 !</text>

      <rect x="64" y="271" width="4" height="20" fill="#343A43"/>
      <text x="92" y="288" fill="#F4F1E9">GET /api/me</text>
      <text x="606" y="288" fill="#83A92F">200 ●</text>
      <text x="794" y="288" fill="#78A8FF">200 ≠</text>
      <text x="946" y="288" fill="#6EE7A8">401 ✓</text>
    </g>

    <path d="M64 320H1136" stroke="#20252A"/>
    <g font-size="13">
      <text x="64" y="355" fill="#83A92F">● baseline</text>
      <text x="204" y="355" fill="#FF665E">! review</text>
      <text x="326" y="355" fill="#6EE7A8">✓ blocked</text>
      <text x="458" y="355" fill="#78A8FF">≠ changed</text>
      <text x="1136" y="355" fill="#C9FF43" text-anchor="end">› gatecrash explain GTC-7A1F0B</text>
    </g>
  </g>
</svg>
